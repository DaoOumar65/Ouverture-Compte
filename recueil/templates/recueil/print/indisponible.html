<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Impression indisponible</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; background: #f3f4f6; margin: 0; padding: 40px 16px; color: #111; }
  .carte { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 8px; padding: 24px 28px; box-shadow: 0 1px 6px rgba(0,0,0,.15); }
  a { color: #1d4ed8; }
</style>
</head>
<body>
  <div class="carte">
    <h1 style="font-size: 18px; margin-top: 0;">Impression non disponible pour ce type de dossier</h1>
    <p>Les formulaires imprimables du <b>compte commercial</b> (personne morale) ne sont pas encore créés dans l'application.
       Les informations du dossier <b>{{ dossier.reference }}</b> sont bien enregistrées et consultables.</p>
    <p><a href="{% url 'recueil:dossier-detail' dossier.pk %}">Retour au dossier</a></p>
  </div>
</body>
</html>
